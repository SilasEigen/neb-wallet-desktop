[package]
name = "neb-wallet-desktop"
description = "Desktop wallet for NEB: a window on the neb-wallet library (keys, scan, coin selection, signing)."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SilasEigen/neb-wallet-desktop"
publish = false

[[bin]]
name = "neb-wallet-gui"
path = "src/main.rs"

[dependencies]
# The wallet library of the NEB project, pinned to a release tag: keys, chain scan, coin selection, signing.
neb-wallet = { git = "https://github.com/SilasEigen/neb", tag = "v1.0.1" }
# The window toolkit. Pinned to a minor version: its API changes between minor versions.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Decodes the two logo images, nothing else.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
strip = true
