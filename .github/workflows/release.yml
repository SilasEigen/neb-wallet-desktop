name: release build

# Builds the Linux archive of a release on an older system, so that the program starts on the systems still in use.
# Started by hand; the archive is kept as an artifact of the run. The Windows archive is built on Windows with the
# same two commands.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Window system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Build
        run: bash build.sh
      - name: Newest C library version the program asks for
        run: objdump -T target/release/neb-wallet-gui | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          python3 -B -I tools/pack.py "$version" linux-x86_64 target/release/neb-wallet-gui out "$(git log -1 --format=%ct)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: out/*.tar.gz
          if-no-files-found: error
